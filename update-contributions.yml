name: Update Contribution Status

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/generate_contributions.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contributions.svg
        env:
          GH_LOGIN: nikkisenpai27
          # Optional: add a PAT as secret GH_PAT to include private contributions
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          OUT: contributions.svg
        run: python .github/scripts/generate_contributions.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.svg
          git diff --staged --quiet || (git commit -m "chore: update contribution status" && git push)
